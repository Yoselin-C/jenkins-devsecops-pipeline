version: '3.8'

networks:
  jenkins-net:
    driver: bridge

services:

  jenkins-master:
    image: jenkins/jenkins:lts
    container_name: jenkins-master
    hostname: jenkins-master
    networks:
      - jenkins-net
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  nodo-dev:
    image: jenkins/ssh-agent:latest
    container_name: nodo-dev
    hostname: nodo-dev
    networks:
      - jenkins-net
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa  yulisa@Yulisa
    restart: unless-stopped

  nodo-staging:
    image: jenkins/ssh-agent:latest
    container_name: nodo-staging
    hostname: nodo-staging
    networks:
      - jenkins-net
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa  yulisa@Yulisa
    restart: unless-stopped

volumes:
  jenkins-data: